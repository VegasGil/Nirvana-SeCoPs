name: Nirvana CI (Unified Security)

on:
  push:
    branches: [main]
    paths:
      - 'bot1_cerebro/**'
      - 'bot2_siem/**'
      - 'bot3_intel/**'
      - 'bot4_human_vector/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/nirvana-ci.yml'
  pull_request:
    branches: [main]

jobs:
  # 1. Validar Reglas Sigma
  validate-sigma:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Sigma
        run: pip install sigma-cli
      - name: Sigma check
        # Ajusta la ruta si tus reglas sigma están en bot1_cerebro
        run: sigma check --fail-on-issues bot1_cerebro/detections/ || echo "No hay reglas Sigma en bot1_cerebro"

  # 2. Escanear el código de la IA con Semgrep (SAST)
  sast-ai:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run Semgrep on AI Code
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/python
        continue-on-error: true

  # 3. Escanear código Node.js (SCA)
  sca-node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd bot2_siem/sample-app || cd bot2_siem || exit 0
          npm install || exit 0
        continue-on-error: true
      - name: Install Trivy
        run: |
          wget https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz
          tar zxvf trivy_0.76.0_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/
      - name: Run Trivy (SCA)
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 bot2_siem/ || echo "No hay paquete Node o Trivy falló"
        continue-on-error: true

  # 4. Ejecutar Tests Unitarios
  test-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Pytest
        run: |
          python -m pytest tests/ -v
  # 5. Validación de Infraestructura (Dockerfile)
  validate-docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      
      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Scan Dockerfile with Trivy (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'