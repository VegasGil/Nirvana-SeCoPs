name: Nirvana CI (Unified Security)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Escanear el código nuevo de la IA (Cerebro)
  sast-ai:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Run Semgrep on AI Code
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/python
        continue-on-error: true

  # 2. Ejecutar Tests Unitarios (El Golden Dataset)
  test-python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema requests
      - name: Run Pytest
        run: |
          # Nos movemos a la carpeta del cerebro para correr los tests
          cd fase1_cerebro
          python -m pytest test_ai.py -v || echo "No hay tests configurados aún para pytest"